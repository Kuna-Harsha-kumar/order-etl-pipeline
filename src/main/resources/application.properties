server.port=8080

spring.application.name=order-etl-pipeline

# ---- Datasource ----
spring.datasource.url=jdbc:postgresql://localhost:5432/orders_db
spring.datasource.username=etl_user
spring.datasource.password=etl_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Fail fast with a clear error if the DB is unreachable, instead of the
# confusing Hibernate "Unable to determine Dialect" message.
spring.datasource.hikari.initialization-fail-timeout=10000
spring.datasource.hikari.connection-timeout=10000

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Explicit dialect as a safety net so a connectivity hiccup surfaces as a
# clear connection error rather than a "cannot determine dialect" error.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ---- Kafka ----
spring.kafka.bootstrap-servers=localhost:9092

# ---- App-specific ----
app.kafka.topic.orders-raw=orders-raw
app.kafka.topic.orders-processed=orders-processed
app.kafka.topic.orders-dlq=orders-dlq
app.demo.generator.enabled=true
app.demo.generator.interval-ms=3000

# ---- Actuator ----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ---- Logging ----
logging.level.com.example.etl=INFO
logging.level.org.apache.kafka=WARN
